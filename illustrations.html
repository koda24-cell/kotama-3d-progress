<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コタマ | イラスト制作管理</title>
<style>
:root{color-scheme:light;--ink:#243247;--muted:#68788d;--line:#dce5ef;--blue:#2869aa;--paper:#fff;--bg:#f3f6fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,sans-serif}main{max-width:1480px;margin:auto;padding:clamp(12px,3vw,36px)}header,.controls,.notice{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:18px;margin-bottom:16px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:clamp(24px,4vw,34px)}h2{font-size:16px;margin:8px 0}p{margin:5px 0}small,.muted{color:var(--muted)}a{color:var(--blue)}button,select,input{font:inherit;color:inherit;border:1px solid #cdd9e6;border-radius:8px;background:white;padding:9px 12px;min-height:42px}button{cursor:pointer}button:hover{background:#edf5fc}button:focus-visible,a:focus-visible{outline:3px solid #77a9d6;outline-offset:2px}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.controls input{flex:1;min-width:160px}.notice{color:#526478;font-size:13px}.summary{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}.stat{background:white;border:1px solid var(--line);border-radius:12px;padding:12px 18px;min-width:120px}.stat strong{display:block;font-size:24px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,215px),1fr));gap:14px;align-items:start}article{background:white;border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0;box-shadow:0 3px 12px #3146640b}.thumb{display:block;width:100%;padding:0;overflow:hidden;border:1px solid var(--line);background:repeating-conic-gradient(#e9eef4 0% 25%,#f8fafc 0% 50%) 50%/20px 20px;cursor:zoom-in}.thumb img{display:block;width:100%;height:220px;object-fit:contain}.thumb[data-category="背景"] img{height:150px}.tags{display:flex;flex-wrap:wrap;gap:5px}.tag{font-size:11px;border-radius:6px;background:#edf2f8;color:#4e6076;padding:2px 6px}.tag.used{background:#e2f0e8;color:#286142}.files{overflow-wrap:anywhere;font-size:12px}.files a{display:block}.files summary{cursor:pointer;color:#526478;font-size:13px}dialog{border:1px solid var(--line);border-radius:14px;background:white;max-width:94vw;max-height:94dvh;padding:14px;overflow:auto}dialog::backdrop{background:#172436b8}#zoom img{display:block;max-width:85vw;max-height:calc(94dvh - 110px);object-fit:contain;margin:auto}#close{position:sticky;top:0;z-index:2;display:block;margin-left:auto;background:#edf4fb}#caption{font-size:14px;margin:6px 0;overflow-wrap:anywhere}@media(max-width:500px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.thumb img{height:170px}article{padding:8px}.controls select{max-width:100%;flex:1}.stat{min-width:80px;flex:1}}
</style></head><body><main>
<header><div><small>KOTAMA / ASSET STUDIO</small><h1>イラスト制作管理</h1><p class="muted">立ち絵・敵・背景・アニメーション</p></div><a href="index.html">← 3D制作進捗へ</a></header>
<div class="notice">閲覧・管理用の台帳です。既に公開されているゲーム素材を元コミットから参照し、原本を複製しません。使用参照ありはゲームコードでの参照確認を意味し、完成承認や権利確認を意味しません。非公開資料・参考画像は掲載対象外です。</div>
<div class="summary" id="summary" aria-live="polite"></div>
<div class="controls"><input id="search" type="search" placeholder="名前・ファイル名・担当で検索" aria-label="検索"><select id="category" aria-label="分類"><option value="">全分類</option><option>キャラクター</option><option>敵・ボス</option><option>背景</option><option>タイトル・UI</option></select><select id="format" aria-label="形式"><option value="">全形式</option><option>静止画</option><option>GIF</option><option>SVG</option></select><select id="usage" aria-label="使用状況"><option value="">全使用状況</option><option>使用参照あり</option><option>用途未確認</option></select><select id="floor" aria-label="階層"><option value="">全階層</option><option value="1">第1層</option><option value="2">第2層</option><option value="3">第3層</option><option value="4">第4層</option><option value="5">第5層</option><option value="6">第6層</option><option value="none">階層未設定</option></select><select id="approval" aria-label="承認"><option value="">全承認状況</option><option>未確認</option><option>制作中</option><option>承認待ち</option><option>承認済み</option></select><button id="refresh">↻ 更新</button></div>
<p id="status" role="status">読み込み中…</p><section class="grid" id="grid"></section></main>
<dialog id="zoom" aria-label="イラスト拡大"><button id="close" autofocus>× 閉じる</button><p id="caption"></p><img id="full" alt=""></dialog>
<script>
const $=id=>document.getElementById(id),repo='koda24-cell/kotama-no-bouken';let records=[],busy=false;
const el=(tag,text)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n};
const enc=p=>p.split('/').map(encodeURIComponent).join('/');
const raw=(r,p)=>'https://raw.githubusercontent.com/'+repo+'/'+r.source_sha+'/'+enc(p);
const blob=(r,p)=>'https://github.com/'+repo+'/blob/'+r.source_sha+'/'+enc(p);
function valid(r){return r&&/^[a-z0-9][a-z0-9_-]{0,100}$/.test(r.id)&&['title','category','variant','version','usage','approval','author'].every(k=>typeof r[k]==='string'&&r[k].length>0)&&/^[0-9a-f]{40}$/.test(r.source_sha)&&Array.isArray(r.files)&&r.files.length>0&&r.files.every(p=>typeof p==='string'&&/^assets\/[^\\?#%]+\.(png|jpe?g|webp|gif|svg)$/i.test(p)&&!p.split('/').some(x=>!x||x==='.'||x==='..'))&&(r.floor===null||Number.isInteger(r.floor)&&r.floor>=1&&r.floor<=6)}
function openImage(r,p){$('full').src=raw(r,p);$('full').alt=r.title;$('caption').textContent=r.title+' / '+p.split('/').pop();if(!$('zoom').open)$('zoom').showModal();$('close').focus()}
function draw(){
const q=$('search').value.trim().toLowerCase(),cat=$('category').value,fmt=$('format').value,usage=$('usage').value,floor=$('floor').value,approval=$('approval').value;
const rows=records.filter(r=>(!cat||r.category===cat)&&(!fmt||r.variant===fmt)&&(!usage||r.usage===usage)&&(!approval||r.approval===approval)&&(!floor||(floor==='none'?r.floor===null:String(r.floor)===floor))&&(!q||[r.title,r.id,r.author,r.version,...r.files].some(s=>s.toLowerCase().includes(q))));
const frag=document.createDocumentFragment();for(const r of rows){const card=el('article');card.dataset.id=r.id;const thumb=el('button');thumb.className='thumb';thumb.dataset.category=r.category;thumb.setAttribute('aria-label',r.title+'を拡大');const p=r.files.find(x=>/\.webp$/i.test(x))||r.files[0];const image=el('img');image.src=raw(r,p);image.alt=r.title;image.loading='lazy';image.onerror=()=>{image.alt='画像取得失敗：'+r.title};thumb.append(image);thumb.onclick=()=>openImage(r,p);card.append(thumb,el('h2',r.title));const tags=el('div');tags.className='tags';for(const label of [r.category,r.variant,r.usage,r.approval,r.floor?'第'+r.floor+'層':'階層未設定']){const tag=el('span',label);tag.className='tag'+(label==='使用参照あり'?' used':'');tags.append(tag)}card.append(tags,el('small',r.version+' / 担当 '+r.author));const details=el('details');details.className='files';details.append(el('summary','原本・形式 '+r.files.length+'件'));for(const path of r.files){const a=el('a',path.split('/').pop());a.href=blob(r,path);a.target='_blank';a.rel='noopener noreferrer';const button=el('button','拡大');button.onclick=()=>openImage(r,path);details.append(a,button)}card.append(details);frag.append(card)}
if(!rows.length)frag.append(el('p','該当するイラストはありません。'));$('grid').replaceChildren(frag);$('status').textContent=rows.length+'件表示 / 全'+records.length+'件';
const stats=[['イラスト',records.length],['原本・形式',records.reduce((n,r)=>n+r.files.length,0)],['GIF',records.filter(r=>r.variant==='GIF').length],['使用参照あり',records.filter(r=>r.usage==='使用参照あり').length]];$('summary').replaceChildren(...stats.map(([label,n])=>{const box=el('div');box.className='stat';box.append(el('small',label),el('strong',String(n)));return box}));
}
async function refresh(){if(busy)return;busy=true;$('refresh').disabled=true;try{const response=await fetch('illustrations.json?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const d=await response.json();if(d.schema!==1||d.source_repo!==repo||!Array.isArray(d.items)||!d.items.every(valid)||new Set(d.items.map(x=>x.id)).size!==d.items.length)throw Error('台帳形式エラー');records=d.items;draw()}catch(e){$('status').textContent='更新失敗・前回表示を保持：'+e.message}finally{busy=false;$('refresh').disabled=false}}
for(const id of ['category','format','usage','floor','approval'])$(id).onchange=draw;$('search').oninput=draw;$('refresh').onclick=refresh;$('close').onclick=()=>$('zoom').close();$('zoom').addEventListener('close',()=>$('full').removeAttribute('src'));$('zoom').addEventListener('click',e=>{if(e.target===$('zoom')){const r=$('zoom').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('zoom').close()}});refresh();
</script></body></html>
