<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コタマ | 3D制作進捗</title><style>
:root{color-scheme:light;--ink:#243247;--muted:#68788d;--line:#dce5ef;--blue:#3976bd;--blue-dark:#285f9f;--surface:#fff;--canvas:#f3f6fa}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#f8fbff 0,#f1f5fa 360px,#f3f6fa 100%);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1480px;margin:auto;padding:clamp(18px,3vw,38px)}
header{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:22px 24px;background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 28px rgba(37,64,96,.06)}
header small{display:block;color:#6484a8;font-size:11px;font-weight:750;letter-spacing:.14em}
h1{margin:2px 0 0;font-size:clamp(25px,3vw,32px);letter-spacing:.015em;color:#20334c}
p{color:var(--muted)}
#status{margin:16px 4px 8px;font-size:13px}
#summary{display:inline-flex;align-items:center;margin:4px 0 18px;padding:9px 14px;border:1px solid #d5e5f6;border-radius:999px;background:#eaf3fc;color:#285b91;font-size:14px;font-weight:700}
button,select{background:#fff;color:#31445c;border:1px solid #d3deea;border-radius:10px;padding:11px 14px;font:inherit;cursor:pointer;transition:background .15s,border-color .15s,transform .15s,box-shadow .15s}
button:hover,select:hover{background:#f0f6fd;border-color:#9dbbdc}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #8bb9ed;outline-offset:2px}
button:disabled{opacity:.55;cursor:wait}
#refresh{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:650;box-shadow:0 3px 8px rgba(57,118,189,.18)}
#refresh:hover{background:var(--blue-dark);border-color:var(--blue-dark)}
nav{display:flex;gap:10px;flex-wrap:wrap}
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:20px;margin-top:20px;align-items:start}
article{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;padding:17px;box-shadow:0 5px 18px rgba(34,57,83,.055);transition:transform .16s,box-shadow .16s}
article:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(34,57,83,.09)}
article h2{font-size:19px;line-height:1.35;margin:2px 0 8px;color:#263d58}
article h3{margin:17px 0 9px;font-size:14px;color:#506b89}
article p{margin:7px 0;color:var(--muted);font-size:13px}
article small{display:block;color:#8190a2;font-size:11px}
article img{display:block;width:100%;aspect-ratio:16/10;object-fit:contain;background:linear-gradient(135deg,#f1f5f8,#e8eef4);border:1px solid #e1e8ef;border-radius:10px;margin:8px 0}
article button{width:100%;margin:0 0 8px;background:#f6f9fd;color:#356b9f;border-color:#dce8f4;font-size:13px;padding:8px 10px}
article a{display:inline-block;margin-top:12px;color:#2869aa;font-size:13px;font-weight:650;text-decoration:none}
article a:hover{text-decoration:underline}
dialog{background:#fff;color:var(--ink);border:1px solid #d5dfeb;border-radius:16px;padding:16px;max-width:95vw;max-height:92vh;box-shadow:0 24px 70px rgba(25,43,65,.25)}
dialog::backdrop{background:rgba(31,48,68,.48);backdrop-filter:blur(3px)}
dialog img{display:block;max-height:75vh;width:auto;max-width:85vw;aspect-ratio:auto;background:#f1f5f8}
#close{margin-bottom:12px;background:#edf4fb;color:#315f8e}
@media(max-width:600px){main{padding:12px}header{padding:17px;border-radius:14px}#grid{gap:14px}article{padding:13px}}
</style><main><header><div><small>KOTAMA / 3D ASSET STUDIO</small><h1>3D制作進捗</h1></div><button id="refresh">↻ 最新情報に更新</button></header><p id="status" role="status" aria-live="polite">取得準備中</p><p id="summary" aria-live="polite">登録状況を集計中…</p><nav><select id="floor"><option value="">すべての階層</option><option>第1層</option><option>第2層</option><option>第3層</option><option>第4層</option><option>第5層</option><option>第6層</option><option>キャラクター</option><option>その他</option></select><select id="kind"><option value="">全画像</option><option value="render">レンダリング</option><option value="design">設計図</option></select></nav><section id="grid"></section></main><dialog id="zoom"><button id="close">閉じる</button><div id="large"></div></dialog><script>
const $=id=>document.getElementById(id), repo='koda24-cell/kotama-no-bouken', base='https://raw.githubusercontent.com/koda24-cell/kotama-3d-progress/3d-progress-data/';let records=[];let registrySignature='';const mergeCache=new Map();
async function mergeStatus(x,node){try{if(!/^[0-9a-f]{40}$/.test(x.source_sha))return;let state=mergeCache.get(x.source_sha);if(!state){const res=await fetch('https://api.github.com/repos/'+repo+'/compare/'+x.source_sha+'...development',{cache:'no-store'});if(!res.ok)throw Error('compare');const d=await res.json();state=['ahead','identical'].includes(d.status)?'development反映済み':['behind','diverged'].includes(d.status)?'未マージ（元コミット）':'確認不能';mergeCache.set(x.source_sha,state)}node.textContent=state}catch(e){node.textContent='マージ状況：確認不能'}}
function el(tag,value){const n=document.createElement(tag);if(value!==undefined)n.textContent=value;return n}
function updateSummary(){const renders=records.reduce((n,x)=>n+x.images.length,0);const designs=records.reduce((n,x)=>n+(x.designs||[]).length,0);const withDesigns=records.filter(x=>(x.designs||[]).length>0).length;$('summary').textContent=`登録 ${records.length}モデル / 実レンダリング ${renders}枚 / 設計図 ${designs}枚（設計図あり ${withDesigns}モデル）`;}
function draw(){updateSummary();const grid=$('grid');grid.replaceChildren();const rows=records.filter(x=>!$('floor').value||x.floor===$('floor').value);for(const x of rows){const card=el('article');card.append(el('h2',x.name),el('p',x.floor+' / '+x.version+' / '+x.status),el('small',x.updated_at));const merge=el('p','マージ状況：確認中');merge.style.fontWeight='bold';card.append(merge);mergeStatus(x,merge);for(const [kind,items] of [["render",x.images],["design",x.designs||[]]]){if($("kind").value&&$("kind").value!==kind)continue;card.append(el("h3",(kind==="design"?"設計図":"レンダリング")+" "+(x[kind+"_version"]||"")));if(!items.length)card.append(el("p","未取得"));for(const v of items){const url=base+v.path.split('/').map(encodeURIComponent).join('/')+'?v='+encodeURIComponent(x.updated_at);const a=el('button',v.view+'・拡大');const img=el('img');img.src=url;img.alt=x.name+' '+v.view;img.loading='lazy';img.onerror=()=>{img.alt='画像取得失敗: '+v.view};a.onclick=()=>{const full=el('img');full.src=url;full.alt=img.alt;$('large').replaceChildren(full);$('zoom').showModal()};card.append(img,a)}}if(Number.isSafeInteger(x.run_id)){const link=el('a',' Actions実行記録');link.href='https://github.com/'+repo+'/actions/runs/'+x.run_id;card.append(link)}grid.append(card)}if(!rows.length)grid.append(el('p','表示できる登録済みモデルはありません。'))}
function valid(x){return x&&typeof x.id==='string'&&typeof x.name==='string'&&typeof x.floor==='string'&&typeof x.version==='string'&&typeof x.status==='string'&&typeof x.updated_at==='string'&&Array.isArray(x.images)&&(x.images.length||(x.designs||[]).length)&&[...x.images,...(x.designs||[])].every(v=>typeof v.view==='string'&&typeof v.path==='string'&&/^renders\/[a-zA-Z0-9_./-]+\.png$/.test(v.path)&&!v.path.split('/').includes('..'))}
async function refresh(){if($('refresh').disabled)return;mergeCache.clear();$('refresh').disabled=true;$('status').textContent='最新情報を取得中…';try{const res=await fetch(base+'index.json?t='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();if(!Array.isArray(data.models)||!data.models.every(valid))throw Error('台帳形式エラー');const signature=JSON.stringify(data.models);if(signature!==registrySignature){records=data.models.sort((a,b)=>b.updated_at.localeCompare(a.updated_at));registrySignature=signature;draw();}else{for(const [i,node] of [...$('grid').querySelectorAll('article>p:nth-of-type(2)')].entries()){const rows=records.filter(x=>!$('floor').value||x.floor===$('floor').value);if(rows[i])mergeStatus(rows[i],node);}}$('status').textContent=records.length+' モデル / 確認 '+new Date().toLocaleString('ja-JP')}catch(e){$('status').textContent='更新できませんでした。前回の表示を保持します。 '+e.message}finally{$('refresh').disabled=false}}
$('refresh').onclick=refresh;$('floor').onchange=draw;$('kind').onchange=draw;$('close').onclick=()=>$('zoom').close();refresh();setInterval(()=>{if(!document.hidden&&!$('zoom').open)refresh()},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('zoom').open)refresh()});
</script></html>
