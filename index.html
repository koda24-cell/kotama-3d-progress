<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>コタマ | 3D制作進捗</title><style>
:root{color-scheme:light;--ink:#243247;--muted:#68788d;--line:#dce5ef;--blue:#3976bd;--blue-dark:#285f9f;--surface:#fff;--canvas:#f3f6fa}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#f8fbff 0,#f1f5fa 360px,#f3f6fa 100%);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1480px;margin:auto;padding:clamp(18px,3vw,38px)}
header{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:22px 24px;background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 28px rgba(37,64,96,.06)}
header small{display:block;color:#6484a8;font-size:11px;font-weight:750;letter-spacing:.14em}
h1{margin:2px 0 0;font-size:clamp(25px,3vw,32px);letter-spacing:.015em;color:#20334c}
p{color:var(--muted)}
#status{margin:16px 4px 8px;font-size:13px}
#summary{display:inline-flex;align-items:center;margin:4px 0 18px;padding:9px 14px;border:1px solid #d5e5f6;border-radius:999px;background:#eaf3fc;color:#285b91;font-size:14px;font-weight:700}
button,select,input{background:#fff;color:#31445c;border:1px solid #d3deea;border-radius:10px;padding:11px 14px;font:inherit;cursor:pointer;transition:background .15s,border-color .15s,transform .15s,box-shadow .15s}
button:hover,select:hover,input:hover{background:#f0f6fd;border-color:#9dbbdc}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #8bb9ed;outline-offset:2px}
button:disabled{opacity:.55;cursor:wait}
#refresh{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:650;box-shadow:0 3px 8px rgba(57,118,189,.18)}
#refresh:hover{background:var(--blue-dark);border-color:var(--blue-dark)}
nav{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}nav input{flex:1 1 220px;min-width:180px}nav select{flex:0 1 auto}.approval-pill{display:inline-flex;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:750;background:#fff1df;color:#9a5b12}.approval-pill.approved{background:#e5f5ec;color:#237447}.history{margin-top:10px;border-top:1px solid #e4eaf1;padding-top:8px}.history summary{cursor:pointer;color:#486989;font-size:12px;font-weight:700}.history li{font-size:12px;color:#718096;margin:5px 0}.status-pill{display:inline-flex;padding:3px 9px;border-radius:999px;background:#eaf3fc;color:#285b91;font-size:11px;font-weight:750}.meta-line{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:8px 0}.meta-chip{padding:3px 7px;border-radius:7px;background:#f1f5f9;color:#60748b;font-size:11px}.card-actions{display:flex;gap:8px;flex-wrap:wrap}.card-actions a{margin-top:8px}
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:20px;margin-top:20px;align-items:start}
article{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;padding:17px;box-shadow:0 5px 18px rgba(34,57,83,.055);transition:transform .16s,box-shadow .16s}
article:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(34,57,83,.09)}
article h2{font-size:19px;line-height:1.35;margin:2px 0 8px;color:#263d58}
article h3{margin:17px 0 9px;font-size:14px;color:#506b89}
article p{margin:7px 0;color:var(--muted);font-size:13px}
article small{display:block;color:#8190a2;font-size:11px}
article img{display:block;width:100%;aspect-ratio:16/10;object-fit:contain;background:linear-gradient(135deg,#f1f5f8,#e8eef4);border:1px solid #e1e8ef;border-radius:10px;margin:8px 0}
article button{width:100%;margin:0 0 8px;background:#f6f9fd;color:#356b9f;border-color:#dce8f4;font-size:13px;padding:8px 10px}
.compare-title{margin:18px 0 10px;font-size:14px;color:#405f80}.compare-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.compare-pane{min-width:0;padding:9px;background:#f7f9fc;border:1px solid #dce5ef;border-radius:11px}.compare-pane strong{display:block;margin-bottom:6px;font-size:12px;color:#526b87}.compare-pane img{margin:0;aspect-ratio:4/3}.compare-empty{display:grid;place-items:center;min-height:100px;padding:12px;text-align:center;color:#7c8b9c;background:#eef2f6;border:1px dashed #c8d3df;border-radius:9px;font-size:12px}.compare-view{margin:12px 0}.compare-view h4{margin:0 0 6px;font-size:12px;color:#6a7e94}
article a{display:inline-block;margin-top:12px;color:#2869aa;font-size:13px;font-weight:650;text-decoration:none}
article a:hover{text-decoration:underline}
dialog{background:#fff;color:var(--ink);border:1px solid #d5dfeb;border-radius:16px;padding:16px;max-width:95vw;max-height:92vh;box-shadow:0 24px 70px rgba(25,43,65,.25)}
dialog::backdrop{background:rgba(31,48,68,.48);backdrop-filter:blur(3px)}
dialog img{display:block;max-height:75vh;width:auto;max-width:85vw;aspect-ratio:auto;background:#f1f5f8}
#close{margin-bottom:12px;background:#edf4fb;color:#315f8e}
@media(max-width:600px){main{padding:12px}header{padding:17px;border-radius:14px}#grid{gap:14px}article{padding:13px}}@media(max-width:430px){.compare-grid{grid-template-columns:1fr}nav input{flex-basis:100%}}
</style><main><header><div><small>KOTAMA / 3D ASSET STUDIO</small><h1>3D制作進捗</h1></div><button id="refresh">↻ 最新情報に更新</button></header><p id="status" role="status" aria-live="polite">取得準備中</p><p id="collectionStatus" role="status">自動収集状況：確認中</p><p id="summary" aria-live="polite">登録状況を集計中…</p><nav><select id="floor"><option value="">すべての階層</option><option>第1層</option><option>第2層</option><option>第3層</option><option>第4層</option><option>第5層</option><option>第6層</option><option>キャラクター</option><option>その他</option></select><select id="kind"><option value="">全画像</option><option value="render">レンダリング</option><option value="design">設計図</option><option value="progress">制作途中</option><option value="compare">設計図と比較</option></select><input id="search" type="search" placeholder="モデル名・ID・階層で検索" aria-label="モデル検索"><select id="statusFilter" aria-label="制作状態"><option value="">すべての状態</option><option>設計中</option><option>制作中</option><option>承認待ち</option><option>完成</option></select><select id="sort" aria-label="並び順"><option value="newest">更新が新しい順</option><option value="oldest">更新が古い順</option><option value="floor">階層順</option><option value="name">名前順</option></select></nav><section id="grid"></section></main><dialog id="zoom"><button id="close">閉じる</button><div id="large"></div></dialog><script>
const $=id=>document.getElementById(id), repo='koda24-cell/kotama-no-bouken', base='https://raw.githubusercontent.com/koda24-cell/kotama-3d-progress/3d-progress-data/';let records=[];const mergeCache=new Map();
async function mergeStatus(x,node){try{if(!/^[0-9a-f]{40}$/.test(x.source_sha))return;let state=mergeCache.get(x.source_sha);if(!state){const res=await fetch('https://api.github.com/repos/'+repo+'/compare/'+x.source_sha+'...development',{cache:'no-store'});if(!res.ok)throw Error('compare');const d=await res.json();state=['ahead','identical'].includes(d.status)?'development反映済み':['behind','diverged'].includes(d.status)?'未マージ（元コミット）':'確認不能';mergeCache.set(x.source_sha,state)}node.textContent=state}catch(e){node.textContent='マージ状況：確認不能'}}
function el(tag,value){const n=document.createElement(tag);if(value!==undefined)n.textContent=value;return n}
function updateSummary(){const renders=records.reduce((n,x)=>n+x.images.length,0);const designs=records.reduce((n,x)=>n+(x.designs||[]).length,0);const withDesigns=records.filter(x=>(x.designs||[]).length>0).length;const progress=records.reduce((n,x)=>n+(x.progress_images||[]).length,0);const approved=records.filter(x=>x.approval_state==='APPROVED').length;const counts=['設計中','制作中','承認待ち','完成'].map(k=>k+' '+records.filter(x=>x.status===k).length).join(' / ');$('summary').textContent=`登録 ${records.length}モデル / 実レンダリング ${renders}枚 / 途中画像 ${progress}枚 / 設計図 ${designs}枚 / 承認済み ${approved}モデル（未承認 ${records.length-approved}） / ${counts}`;}
function imageUrl(x,v){return base+v.path.split('/').map(encodeURIComponent).join('/')+'?v='+encodeURIComponent(x.updated_at)}
function imageButton(x,v){const url=imageUrl(x,v);const a=el('button',v.view+'・拡大');const img=el('img');img.src=url;img.alt=x.name+' '+v.view;img.loading='lazy';img.onerror=()=>{img.alt='画像取得失敗: '+v.view};a.onclick=()=>{const full=el('img');full.src=url;full.alt=img.alt;$('large').replaceChildren(full);$('zoom').showModal()};return [img,a]}
function drawComparison(card,x){const versions=[...new Set([x.version,x.design_version,x.progress_version,x.render_version,...(x.history||[]).map(h=>h.version)].filter(Boolean))];const select=el('select');select.setAttribute('aria-label','比較バージョン');select.append(new Option('各種類の最新版',''));for(const v of versions)select.append(new Option(v,v));const target=el('div');card.append(select,target);function show(){target.replaceChildren();const v=select.value;const y={...x};if(v){for(const [k,f] of [['design','designs'],['progress','progress_images'],['render','images']]){y[f]=(x[k+'_version']||(k==='render'?x.version:null))===v?x[f]||[]:((x.history||[]).find(h=>h.kind===k&&h.version===v)||{}).images||[]}}drawComparisonImages(target,y)}select.onchange=show;show()}function drawComparisonImages(card,x){card.append(el('h3','設計図と実レンダリングの比較'));const renders=x.images||[],designs=x.designs||[],progress=x.progress_images||[];const views=[...new Set([...renders.map(v=>v.view),...designs.map(v=>v.view),...progress.map(v=>v.view)])];if(!views.length){card.append(el('p','比較できる画像がまだ登録されていません。'));return}for(const view of views){const section=el('div');section.className='compare-view';section.append(el('h4',view));const grid=el('div');grid.className='compare-grid';for(const [label,items] of [['設計図',designs],['制作途中',progress],['完成レンダリング',renders]]){const pane=el('div');pane.className='compare-pane';pane.append(el('strong',label));const item=items.find(v=>v.view===view);if(item){const [img,button]=imageButton(x,item);pane.append(img,button)}else{const empty=el('div','この方向の画像は未登録');empty.className='compare-empty';pane.append(empty)}grid.append(pane)}section.append(grid);card.append(section)}} 
function draw(){updateSummary();const grid=$('grid');grid.replaceChildren();const q=$('search').value.trim().toLocaleLowerCase('ja');const state=$('statusFilter').value;const rows=records.filter(x=>(!$('floor').value||x.floor===$('floor').value)&&(!state||x.status===state)&&(!q||[x.name,x.id,x.floor,x.version].some(v=>String(v||'').toLocaleLowerCase('ja').includes(q))));const sort=$('sort').value;rows.sort((a,b)=>sort==='oldest'?a.updated_at.localeCompare(b.updated_at):sort==='floor'?a.floor.localeCompare(b.floor,'ja')||a.name.localeCompare(b.name,'ja'):sort==='name'?a.name.localeCompare(b.name,'ja'):b.updated_at.localeCompare(a.updated_at));for(const x of rows){const card=el('article');card.append(el('h2',x.name));const meta=el('div');meta.className='meta-line';const pill=el('span',x.status);pill.className='status-pill';meta.append(pill);const approval=el('span',x.approval_state==='APPROVED'?'承認済み':'未承認');approval.className='approval-pill'+(x.approval_state==='APPROVED'?' approved':'');meta.append(approval);for(const label of [x.floor,x.version,'ID: '+x.id]){const chip=el('span',label);chip.className='meta-chip';meta.append(chip)}card.append(meta,el('small','最終更新 '+x.updated_at));const merge=el('p','マージ状況：確認中');merge.style.fontWeight='bold';card.append(merge);mergeStatus(x,merge);if($('kind').value==='compare'){drawComparison(card,x)}else{for(const [kind,items] of [["render",x.images],["design",x.designs||[]],["progress",x.progress_images||[]]]){if($("kind").value&&$("kind").value!==kind)continue;card.append(el("h3",(kind==="design"?"設計図":kind==="progress"?"制作途中":"レンダリング")+" "+(x[kind+"_version"]||"")));if(!items.length)card.append(el("p","未取得"));for(const v of items){const [img,button]=imageButton(x,v);card.append(img,button)}}}const stats=el('p',`完成 ${x.images.length}枚 / 途中 ${(x.progress_images||[]).length}枚 / 設計図 ${(x.designs||[]).length}枚`);card.append(stats);if(x.design_run_id){const link=el('a','設計図の元Actions');link.href='https://github.com/'+repo+'/actions/runs/'+Number(x.design_run_id);link.target='_blank';link.rel='noopener noreferrer';card.append(link)}if(Array.isArray(x.history)&&x.history.length){const details=el('details');details.className='history';details.append(el('summary','過去バージョン '+x.history.length+'件'));const list=el('ul');for(const h of [...x.history].reverse()){const li=el('li',`${h.kind} ${h.version||'不明'} / ${h.updated_at||''} / ${h.approval_state||'NOT_APPROVED'} / run ${h.run_id||'不明'}`);if(Array.isArray(h.images)){for(const v of h.images){if(typeof v.path!=='string'||!/^renders\/[a-zA-Z0-9_./-]+\.png$/.test(v.path)||v.path.split('/').includes('..'))continue;const [img,button]=imageButton(x,v);li.append(img,button)}}list.append(li)}details.append(list);card.append(details)}const actions=el('div');actions.className='card-actions';if(Number.isSafeInteger(x.run_id)){const link=el('a','元Actions実行');link.href='https://github.com/'+repo+'/actions/runs/'+x.run_id;link.target='_blank';link.rel='noopener noreferrer';actions.append(link)}if(/^[0-9a-f]{40}$/.test(x.source_sha)){const commit=el('a','元コミット');commit.href='https://github.com/'+repo+'/commit/'+x.source_sha;commit.target='_blank';commit.rel='noopener noreferrer';actions.append(commit)}if(actions.childElementCount)card.append(actions);grid.append(card)}if(!rows.length)grid.append(el('p','条件に一致するモデルはありません。検索語やフィルターを変更してください。'))}
function valid(x){return x&&typeof x.id==='string'&&typeof x.name==='string'&&typeof x.floor==='string'&&typeof x.version==='string'&&typeof x.status==='string'&&typeof x.updated_at==='string'&&Array.isArray(x.images)&&Array.isArray(x.designs||[])&&Array.isArray(x.progress_images||[])&&(x.images.length||(x.designs||[]).length||(x.progress_images||[]).length)&&[...x.images,...(x.designs||[]),...(x.progress_images||[])].every(v=>typeof v.view==='string'&&typeof v.path==='string'&&/^renders\/[a-zA-Z0-9_./-]+\.png$/.test(v.path)&&!v.path.split('/').includes('..'))}
async function collectionStatus(){try{const r=await fetch(base+'collection-status.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();$('collectionStatus').textContent='自動収集：'+(d.result==='success'?'成功':'失敗・要確認')+' / '+d.updated_at}catch(e){$('collectionStatus').textContent='自動収集状況：未確認'}}
async function refresh(){collectionStatus();if($('refresh').disabled)return;mergeCache.clear();$('refresh').disabled=true;$('status').textContent='最新情報を取得中…';try{const res=await fetch(base+'index.json?t='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();if(!Array.isArray(data.models)||!data.models.every(valid))throw Error('台帳形式エラー');records=data.models.slice().sort((a,b)=>b.updated_at.localeCompare(a.updated_at));draw();$('status').textContent=records.length+' モデル / 確認 '+new Date().toLocaleString('ja-JP')}catch(e){$('status').textContent='更新できませんでした。前回の表示を保持します。 '+e.message}finally{$('refresh').disabled=false}}
$('refresh').onclick=refresh;$('floor').onchange=draw;$('kind').onchange=draw;$('statusFilter').onchange=draw;$('sort').onchange=draw;$('search').oninput=draw;$('close').onclick=()=>$('zoom').close();refresh();setInterval(()=>{if(!document.hidden&&!$('zoom').open)refresh()},60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('zoom').open)refresh()});
</script></html>
