name: Migrate inspected gallery registry and PNGs
on:
  push:
    branches: [feature/gallery-migration-20261124]
    paths:
      - .github/workflows/migrate-data.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination data branch
        uses: actions/checkout@v4
        with:
          ref: 3d-progress-data
          path: registry
      - name: Download only legacy registry and renders
        run: |
          git clone --depth 1 --filter=blob:none --sparse --branch 3d-progress-data https://github.com/koda24-cell/kotama-no-bouken.git legacy
          git -C legacy sparse-checkout set renders
          test -s legacy/index.json
          test -d legacy/renders
      - name: Validate every model and every PNG hash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          root=Path('legacy')
          data=json.loads((root/'index.json').read_text(encoding='utf-8'))
          rows=data['models']
          assert len(rows)==14, f'expected 14 model rows, got {len(rows)}'
          count=0
          ids=set()
          for row in rows:
              assert re.fullmatch(r'[a-z0-9][a-z0-9_-]{0,79}',row['id'])
              assert row['id'] not in ids
              ids.add(row['id'])
              for preview in row['images']:
                  rel=Path(preview['path'])
                  assert rel.parts[0]=='renders' and '..' not in rel.parts
                  p=(root/rel).resolve()
                  assert p.is_relative_to(root.resolve()) and p.is_file()
                  content=p.read_bytes()
                  assert content.startswith(b'\x89PNG\r\n\x1a\n')
                  assert hashlib.sha256(content).hexdigest()==preview['sha256']
                  assert rel.stem==preview['sha256']
                  count+=1
          assert count==56, f'expected 56 images, got {count}'
          print(f'MIGRATION_VERIFIED models={len(rows)} images={count}')
          PY
      - name: ClamAV malware scan on imported data
        run: |
          docker run --rm -v "$PWD/legacy:/scan:ro" ghcr.io/koda24-cell/kotama-blender53-clamav@sha256:5ce601f79b1ab09405b3ebc36b1a596be76cb8b105b1524fcbafcb186ebf7e99 bash -ec 'freshclam; clamscan -r --infected /scan/renders'
      - name: Copy and commit checked data without force push
        run: |
          cp legacy/index.json registry/index.json
          cp -a legacy/renders registry/renders
          cd registry
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.json renders
          if git diff --cached --quiet; then echo 'No changes needed'; exit 0; fi
          git commit -m "Migrate 14 inspected 3D models and 56 PNG previews"
          git push origin HEAD:3d-progress-data
