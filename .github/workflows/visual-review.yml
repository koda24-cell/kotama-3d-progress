name: Actual render visual review
on:
  pull_request:
    paths: ['tools/3d-progress/**', '.github/workflows/visual-review.yml', 'index.html']
  push:
    branches: [main]
    paths: ['tools/3d-progress/visual_review.py', '.github/workflows/visual-review.yml']
  schedule:
    - cron: '42 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conflict-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/3d-progress/test_publish_review.py
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 3d-progress-data
          path: registry
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'transformers>=4.48,<5' pillow
      - run: python tools/3d-progress/visual_review.py registry visual-review.json --limit 1000
      - uses: actions/upload-artifact@v4
        with:
          name: visual-review
          path: visual-review.json
  publish:
    needs: [review, conflict-test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 3d-progress-data
          path: registry
      - uses: actions/download-artifact@v4
        with:
          name: visual-review
          path: report
      - name: Publish only report without modifying registry images
        run: |
          cd registry
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash ../tools/3d-progress/publish_review.sh origin 3d-progress-data "$PWD/../report/visual-review.json"
