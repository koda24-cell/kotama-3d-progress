name: Collect Kotama 3D production artifacts
on:
  pull_request:
    paths: ['.github/workflows/collect-kotama-artifacts.yml', 'tools/3d-progress/**']
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Optional successful kotama-no-bouken Actions run ID (blank = discover recent successful runs)"
        required: false
        type: string
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
concurrency:
  group: kotama-gallery-artifact-intake
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout collector code
        uses: actions/checkout@v4
        with:
          path: collector
          persist-credentials: false
      - name: Checkout gallery data branch
        uses: actions/checkout@v4
        with:
          ref: 3d-progress-data
          fetch-depth: 0
          path: registry
      - name: Validate source access
        env:
          SOURCE_REPO_READ_TOKEN: ${{ secrets.SOURCE_REPO_READ_TOKEN || github.token }}
        run: |
          test -n "$SOURCE_REPO_READ_TOKEN" || { echo "::error::Set SOURCE_REPO_READ_TOKEN with read access to koda24-cell/kotama-no-bouken Actions artifacts."; exit 1; }
          GH_TOKEN="$SOURCE_REPO_READ_TOKEN" gh auth status
      - name: Discover and download source artifacts
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPO_READ_TOKEN || github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then SOURCE_RUN_ID=45326448034; fi
          export SOURCE_RUN_ID
          python3 collector/tools/3d-progress/collect.py
      - name: Install and run malware scanner
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam.service
          sudo freshclam
          test -s /var/lib/clamav/daily.cvd || test -s /var/lib/clamav/daily.cld
          clamscan --recursive --infected --no-summary incoming
      - name: Validate manifests and update append-only registry
        run: |
          python3 -m unittest discover -s collector/tools/3d-progress -v
          python3 collector/tools/3d-progress/ingest_artifacts.py registry incoming
      - name: Record collection status
        if: always()
        env:
          COLLECTION_RESULT: ${{ job.status }}
        run: |
          python3 -c 'import json,os,datetime; from pathlib import Path; Path("registry/collection-status.json").write_text(json.dumps(dict(result=os.environ["COLLECTION_RESULT"],updated_at=datetime.datetime.now(datetime.timezone.utc).isoformat(),run_id=os.environ["GITHUB_RUN_ID"])))'
      - name: Commit verified registry changes
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: registry
        run: |
          if [ "${{ job.status }}" != success ]; then git restore -- index.json renders/; git clean -fd -- renders/; fi
          if [ -z "$(git status --porcelain -- index.json renders/ collection-status.json)" ]; then echo "No new verified assets."; exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.json renders/ collection-status.json
          git commit -m "Collect verified Kotama 3D artifact checkpoints"
          for attempt in 1 2 3; do
            if git push origin HEAD:3d-progress-data; then exit 0; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep "$((attempt * 2))"
            cp collection-status.json ../collection-status-retry.json
            git fetch origin 3d-progress-data
            git reset --hard FETCH_HEAD
            cp ../collection-status-retry.json collection-status.json
            if [ "${{ job.status }}" = success ]; then
              python3 ../collector/tools/3d-progress/ingest_artifacts.py . ../incoming
            fi
            git add index.json renders/ collection-status.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Retry verified gallery collection"
          done
