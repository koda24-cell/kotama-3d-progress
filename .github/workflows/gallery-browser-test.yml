name: 3D gallery browser migration test
on:
  push:
    branches: [feature/gallery-migration-20261124, feature/live-preview-refresh, main]
    paths:
      - index.html
      - .github/workflows/gallery-browser-test.yml
      - tools/3d-progress/**
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm install --no-save --prefix /tmp/gallery-test playwright
          /tmp/gallery-test/node_modules/.bin/playwright install --with-deps chromium
      - name: Test real data and refresh behavior
        run: |
          python3 -m http.server 8765 >/tmp/gallery-server.log 2>&1 &
          NODE_PATH=/tmp/gallery-test/node_modules node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage();
              await page.goto('http://127.0.0.1:8765/index.html');
              await page.waitForFunction(()=>document.querySelectorAll('article').length>=14);
              const scenes=page.locator('#sceneReviews .scene-grid img');
              if(await scenes.count()!==13)throw Error('Claude scene count mismatch');
              await scenes.first().scrollIntoViewIfNeeded();
              await scenes.first().evaluate(img=>img.decode());
              for(const url of await scenes.evaluateAll(imgs=>imgs.map(i=>i.src))){
                const response=await page.request.get(url);
                if(!response.ok()||!(response.headers()['content-type']||'').includes('image/jpeg'))throw Error('scene image unavailable: '+url);
              }
              if(await page.locator('#sceneReviews .scene-assets li').count()!==12)throw Error('Claude asset source inventory missing');
              const feed='https://raw.githubusercontent.com/koda24-cell/kotama-no-bouken/development/docs/3d/scene-review-index.json';
              const actual=await page.request.get(feed);
              if(!actual.ok())throw Error('source review catalog missing');
              const catalog=await actual.json();
              if(!catalog.reviews.some(r=>r.id==='b5-abyss-temple'&&r.images.length===13))throw Error('B5 source entry missing');
              await page.waitForFunction(()=>document.querySelector('#liveSceneStatus').textContent.includes('自動取得成功'));
              const entry={...catalog.reviews[0],id:'test-review',version:'V-next',title:'Automatic review test',floor:4,images:[catalog.reviews[0].images[0]]};
              const route=feed+'?*';
              await page.route(route,r=>r.fulfill({json:{schema:1,reviews:[...catalog.reviews,entry]},headers:{'access-control-allow-origin':'*'}}));
              await page.locator('#refresh').click();
              await page.locator('#liveSceneRows summary').filter({hasText:'Automatic review test'}).waitFor();
              await page.locator('#liveSceneRows summary').filter({hasText:'Automatic review test'}).click();
              await page.locator('#liveSceneRows img').first().evaluate(img=>img.decode());
              await page.locator('#liveSceneFloor').selectOption('5');
              if(await page.locator('#liveSceneRows details').count())throw Error('scene floor filter failed');
              await page.locator('#liveSceneFloor').selectOption('');
              await page.unroute(route);
              await page.route(route,r=>r.fulfill({json:{schema:1,reviews:[{...entry,images:[{path:'docs/3d/../unsafe.jpg',label:'unsafe'}]}]},headers:{'access-control-allow-origin':'*'}}));
              await page.locator('#refresh').click();
              await page.waitForFunction(()=>document.querySelector('#liveSceneStatus').textContent.includes('自動取得失敗'));
              if(!await page.locator('#liveSceneRows summary').filter({hasText:'Automatic review test'}).count())throw Error('previous scene data lost');
              await page.unroute(route);
              await page.locator('#refresh').click();
              await page.waitForFunction(()=>document.querySelector('#liveSceneStatus').textContent.includes('自動取得成功'));


              await page.locator('article img').first().scrollIntoViewIfNeeded();
              await page.waitForFunction(()=>document.querySelector('article img').naturalWidth>0);
              const data=await (await page.request.get('https://raw.githubusercontent.com/koda24-cell/kotama-3d-progress/3d-progress-data/index.json')).json();
              const row=structuredClone(data.models[0]);
              row.version='TEST-REFRESH';row.id='browser-test-new';row.name='Browser test';row.designs=row.images;row.images=[];row.status='設計中';row.design_version='D01';
              const compareRow=structuredClone(data.models[0]);compareRow.id='browser-compare-new';compareRow.name='Compare test';compareRow.designs=data.models[0].images;compareRow.design_version='D01';
              await page.route('**/3d-progress-data/index.json?*',route=>route.fulfill({json:{...data,models:[...data.models,row,compareRow]},headers:{'access-control-allow-origin':'*'}}));
              await page.locator('#refresh').click();
              await page.getByRole('heading',{name:'Browser test',exact:true}).waitFor();
              const card=page.locator('article').filter({has:page.getByRole('heading',{name:'Browser test',exact:true})});
              await page.locator('#kind').selectOption('design');
              await card.getByRole('heading',{name:'設計図 D01'}).waitFor();
              await card.locator('img').first().scrollIntoViewIfNeeded();
              await card.locator('img').first().evaluate(img=>img.decode());
              await card.locator('button').first().click();
              await page.locator('#zoom[open]').waitFor();
              await page.locator('#close').click();
              await page.locator('#kind').selectOption('compare');
              await page.locator('#search').fill('browser-test-new');
              await page.getByRole('heading',{name:'Browser test',exact:true}).waitFor();
              if(await page.locator('article').count()!==1)throw Error('search filter did not isolate model');
              await page.locator('#search').fill('');
              await page.locator('#statusFilter').selectOption('設計中');
              await page.getByRole('heading',{name:'Browser test',exact:true}).waitFor();
              if(await page.locator('article').count()!==1)throw Error('status filter did not isolate model');
              await page.locator('#statusFilter').selectOption('');
              await page.locator('#sort').selectOption('name');
              await page.locator('#sort').selectOption('newest');
              const compareCard=page.locator('article').filter({has:page.getByRole('heading',{name:'Compare test',exact:true})});
              await compareCard.getByRole('heading',{name:'設計図と実レンダリングの比較'}).waitFor();
              if(await compareCard.locator('.compare-grid').first().locator('.compare-pane').count()!==3)throw Error('comparison panes missing');
              await compareCard.locator('.compare-pane img').first().evaluate(img=>img.decode());
              await page.locator('#kind').selectOption('');
              await page.unroute('**/3d-progress-data/index.json?*');
              await page.locator('#refresh').click();
              await page.getByRole('heading',{name:'Browser test',exact:true}).waitFor({state:'detached'});
              await page.getByRole('heading',{name:'Compare test',exact:true}).waitFor({state:'detached'});
              await page.screenshot({path:'gallery-browser.png',fullPage:true});
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: gallery-browser-proof
          path: gallery-browser.png
          retention-days: 14
