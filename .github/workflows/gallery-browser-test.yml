name: 3D gallery browser migration test
on:
  push:
    branches: [feature/gallery-migration-20261124, feature/live-preview-refresh, main]
    paths:
      - index.html
      - .github/workflows/gallery-browser-test.yml
      - tools/3d-progress/**
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm install --no-save --prefix /tmp/gallery-test playwright
          /tmp/gallery-test/node_modules/.bin/playwright install --with-deps chromium
      - name: Test real data and refresh behavior
        run: |
          python3 -m http.server 8765 >/tmp/gallery-server.log 2>&1 &
          NODE_PATH=/tmp/gallery-test/node_modules node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage();
              await page.goto('http://127.0.0.1:8765/index.html');
              await page.waitForFunction(()=>document.querySelectorAll('article').length>=14);
              const scenes=page.locator('#sceneReviews .scene-grid img:not([data-city-v2]):not([data-city-v3])');
              if(await scenes.count()!==13)throw Error('Claude scene count mismatch');
              await scenes.first().scrollIntoViewIfNeeded();
              await scenes.first().evaluate(img=>img.decode());
              for(const url of await scenes.evaluateAll(imgs=>imgs.map(i=>i.src))){
                const response=await page.request.get(url);
                if(!response.ok()||!(response.headers()['content-type']||'').includes('image/jpeg'))throw Error('scene image unavailable: '+url);
              }
              if(await page.locator('#sceneReviews .scene-assets li').count()!==12)throw Error('Claude asset source inventory missing');
              const city=page.locator('#f3CityV2Review img[data-city-v2]');
              if(await city.count()!==4)throw Error('F3 V2 actual scene views missing');
              for(const url of await city.evaluateAll(imgs=>imgs.map(i=>i.src))){
                if(!/^https:\/\/raw\.githubusercontent\.com\/koda24-cell\/kotama-no-bouken\/[a-f0-9]{40}\/docs\/3d\/f3-city-v2-review-20261126\//.test(url))throw Error('F3 image source is not immutable');
                const response=await page.request.get(url);
                if(!response.ok()||!(response.headers()['content-type']||'').includes('image/png'))throw Error('F3 actual PNG unavailable: '+url);
              }
              const cityV3=page.locator('#f3CityV3Review img[data-city-v3]');
              if(await cityV3.count()!==6)throw Error('F3 V3 actual scene views missing');
              for(const url of await cityV3.evaluateAll(imgs=>imgs.map(i=>i.src))){
                if(!/^https:\/\/raw\.githubusercontent\.com\/koda24-cell\/kotama-no-bouken\/[a-f0-9]{40}\/docs\/3d\/f3-city-v3-review-20261127\//.test(url))throw Error('F3 V3 image source is not immutable');
                const response=await page.request.get(url);
                if(!response.ok()||!(response.headers()['content-type']||'').includes('image/png'))throw Error('F3 V3 actual PNG unavailable: '+url);
              }
              const thumb=page.locator('#sceneReviews .scene-grid img').first();
              const initialUrl=page.url();
              await thumb.click();
              await page.locator('#zoom[open]').waitFor();
              await page.locator('#large img').evaluate(img=>img.decode());
              await page.locator('#close').click();
              await page.locator('#zoom[open]').waitFor({state:'detached'});
              await thumb.click();
              await page.locator('#zoom[open]').waitFor();
              await page.keyboard.press('Escape');
              await page.locator('#zoom[open]').waitFor({state:'detached'});
              await thumb.click();
              await page.locator('#zoom[open]').waitFor();
              await page.mouse.click(1,1);
              await page.locator('#zoom[open]').waitFor({state:'detached'});
              if(page.url()!==initialUrl||page.context().pages().length!==1)throw Error('image opened a different page');
              await page.locator('article img').first().scrollIntoViewIfNeeded();
              await page.locator('article img').first().click();
              await page.locator('#zoom[open]').waitFor();
              await page.locator('#close').click();
              await page.locator('#zoom[open]').waitFor({state:'detached'});


              await page.locator('article img').first().scrollIntoViewIfNeeded();
              await page.waitForFunction(()=>document.querySelector('article img').naturalWidth>0);
              const data=await (await page.request.get('https://raw.githubusercontent.com/koda24-cell/kotama-3d-progress/3d-progress-data/index.json')).json();
              const row=structuredClone(data.models[0]);
              row.version='TEST-REFRESH';row.id='browser-test-new';row.name='Browser test';row.designs=row.images;row.images=[];row.status='設計中';row.design_version='D01';
              const compareRow=structuredClone(data.models[0]);compareRow.id='browser-compare-new';compareRow.name='Compare test';compareRow.designs=data.models[0].images;compareRow.design_version='D01';
              await page.route('**/3d-progress-data/index.json?*',route=>route.fulfill({json:{...data,models:[...data.models,row,compareRow]},headers:{'access-control-allow-origin':'*'}}));
              await page.locator('#refresh').click();
              await page.getByRole('heading',{name:'Browser test',exact:true}).waitFor();
              const card=page.locator('article').filter({has:page.getByRole('heading',{name:'Browser test',exact:true})});
              await page.locator('#kind').selectOption('design');
              await card.getByRole('heading',{name:'設計図 D01'}).waitFor();
              await card.locator('img').first().scrollIntoViewIfNeeded();
              await card.locator('img').first().evaluate(img=>img.decode());
              await card.locator('button').first().click();
              await page.locator('#zoom[open]').waitFor();
              await page.locator('#close').click();
              await page.locator('#kind').selectOption('compare');
              await page.locator('#search').fill('browser-test-new');
              await page.getByRole('heading',{name:'Browser test',exact:true}).waitFor();
              if(await page.locator('article').count()!==1)throw Error('search filter did not isolate model');
              await page.locator('#search').fill('');
              await page.locator('#statusFilter').selectOption('設計中');
              await page.getByRole('heading',{name:'Browser test',exact:true}).waitFor();
              if(await page.locator('article').count()!==1)throw Error('status filter did not isolate model');
              await page.locator('#statusFilter').selectOption('');
              await page.locator('#sort').selectOption('name');
              await page.locator('#sort').selectOption('newest');
              const compareCard=page.locator('article').filter({has:page.getByRole('heading',{name:'Compare test',exact:true})});
              await compareCard.getByRole('heading',{name:'設計図と実レンダリングの比較'}).waitFor();
              if(await compareCard.locator('.compare-grid').first().locator('.compare-pane').count()!==3)throw Error('comparison panes missing');
              await compareCard.locator('.compare-pane img').first().evaluate(img=>img.decode());
              await page.locator('#kind').selectOption('');
              await page.unroute('**/3d-progress-data/index.json?*');
              await page.locator('#refresh').click();
              await page.getByRole('heading',{name:'Browser test',exact:true}).waitFor({state:'detached'});
              await page.getByRole('heading',{name:'Compare test',exact:true}).waitFor({state:'detached'});
              await page.screenshot({path:'gallery-browser.png',fullPage:true});
              await page.getByRole('link',{name:'イラスト制作管理 →'}).click();
              await page.waitForURL('**/illustrations.html');
              await page.waitForFunction(()=>document.querySelectorAll('#grid article').length>=40);
              const catalog=await (await page.request.get('http://127.0.0.1:8765/illustrations.json')).json();
              if(await page.locator('#grid article').count()!==catalog.items.length)throw Error('illustration count mismatch');
              const recent=catalog.items.filter(r=>r.version==='2026-11-26追加');
              if(recent.length<6)throw Error('recent enemy images missing');
              for(const r of recent){
                const card=page.locator('article[data-id="'+r.id+'"]');
                await card.locator('.assignment').waitFor();
                const expected='割当先：'+(r.assigned_to.length?r.assigned_to.join('、'):'未確認');
                if(await card.locator('.assignment').textContent()!==expected)throw Error('assignment text mismatch '+r.id);
                await card.locator('.thumb').click();
                await page.locator('#full').evaluate(img=>img.decode());
                await page.locator('#close').click();
              }
              await page.locator('#search').fill('はぐれスライム');
              if(await page.locator('article[data-id="enemy-unidentified-2"]').count()!==1)throw Error('assignment search failed');
              await page.locator('#search').fill('');

              await page.locator('#category').selectOption('キャラクター');
              const characterCount=catalog.items.filter(r=>r.category==='キャラクター').length;
              if(await page.locator('#grid article').count()!==characterCount)throw Error('illustration category filter failed');
              await page.locator('#search').fill('コタマ');
              await page.locator('article[data-id="kotama-current"] .thumb').click();
              await page.locator('#zoom[open]').waitFor();
              await page.locator('#full').evaluate(img=>img.decode());
              await page.locator('#close').click();
              await page.locator('#zoom[open]').waitFor({state:'detached'});
              await page.locator('#search').fill('');
              await page.locator('#category').selectOption('敵・ボス');
              await page.locator('#format').selectOption('GIF');
              if(await page.locator('#grid article').count()!==catalog.items.filter(r=>r.category==='敵・ボス'&&r.variant==='GIF').length)throw Error('GIF filter failed');
              await page.locator('article[data-id="slime-gif"] .thumb').click();
              await page.locator('#full').evaluate(img=>img.decode());
              await page.keyboard.press('Escape');
              await page.locator('#zoom[open]').waitFor({state:'detached'});
              await page.locator('#category').selectOption('背景');
              await page.locator('#format').selectOption('');
              await page.locator('#floor').selectOption('5');
              if(await page.locator('#grid article').count()!==1)throw Error('background floor filter failed');
              await page.locator('article[data-id="battle-floor-5"] .thumb').click();
              await page.locator('#full').evaluate(img=>img.decode());
              await page.locator('#close').click();
              await page.locator('#floor').selectOption('');
              await page.locator('#category').selectOption('');
              await page.locator('#refresh').click();
              await page.waitForFunction(n=>document.querySelectorAll('#grid article').length===n,catalog.items.length);
              await page.screenshot({path:'illustration-browser.png',fullPage:false});
              await page.getByRole('link',{name:'← 3D制作進捗へ'}).click();
              await page.waitForURL('**/index.html');

            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: gallery-browser-proof
          path: |
            gallery-browser.png
            illustration-browser.png
          retention-days: 14
