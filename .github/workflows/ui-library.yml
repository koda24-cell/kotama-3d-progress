name: UI library image verification
on:
  pull_request:
    paths: [ui-library/**, tools/ui-library/**, .github/workflows/ui-library.yml]
  push:
    branches: [main]
    paths: [ui-library/**, tools/ui-library/**, .github/workflows/ui-library.yml]
permissions:
  contents: read
jobs:
  render:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin python3-pil
      - run: |
          python3 tools/ui-library/build.py ui-library
          git diff --exit-code -- ui-library
          mkdir -p rendered
          find ui-library -name '*.svg' -print0 | while IFS= read -r -d '' svg; do
            target="rendered/${svg#ui-library/}"
            mkdir -p "$(dirname "$target")"
            rsvg-convert "$svg" -o "${target%.svg}.png"
          done
          python3 tools/ui-library/verify.py rendered
      - uses: actions/upload-artifact@v4
        with:
          name: ui-library-png
          path: rendered/
          retention-days: 3
