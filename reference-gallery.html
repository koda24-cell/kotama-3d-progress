<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>参考イラスト | KOTAMA</title><style>body{font:16px system-ui;background:#f1f5f9;color:#24354b;margin:0}main{max-width:1200px;margin:auto;padding:18px}a{color:#2869aa}nav{display:flex;gap:12px;flex-wrap:wrap}button,select,input{font:inherit;padding:10px;border:1px solid #ccd6e2;border-radius:8px;background:white}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}article{background:white;border-radius:12px;padding:14px;overflow:hidden}iframe{width:100%;border:0;height:480px}small{color:#526579}button[aria-pressed=true]{background:#dcecff}dialog{max-width:90vw;width:600px;border:0;border-radius:12px}dialog::backdrop{background:#0008}</style><main><nav><a href="index.html">3D制作進捗</a><a href="illustrations.html">イラスト制作管理</a></nav><h1>参考イラスト</h1><p>外部作品の閲覧専用。自作素材・採用済み素材とは別管理です。</p><nav><button data-site="all" aria-pressed="true">すべて</button><button data-site="X" aria-pressed="false">X</button><button data-site="pixiv" aria-pressed="false">pixiv</button><select id="date" aria-label="調査日"></select><input id="q" type="search" placeholder="作者・作品名"></nav><p id="status" role="status">読み込み中</p><section id="grid"></section><p>画像は保存しません。公式埋め込みが表示できない場合は元作品リンクをご利用ください。閲覧制限は回避しません。</p></main><dialog id="detail"><button id="close">閉じる</button><div id="preview"></div></dialog><script>
const $=id=>document.getElementById(id);let days=[],site='all';const el=(tag,t)=>{const n=document.createElement(tag);if(t!==undefined)n.textContent=t;return n};function valid(r){return r.site==='X'?/^https:\/\/x\.com\/[A-Za-z0-9_]+\/status\/\d+$/.test(r.url):r.site==='pixiv'&&/^https:\/\/www\.pixiv\.net\/(?:en\/)?artworks\/\d+$/.test(r.url)}function preview(r,host){host.replaceChildren();if(r.site==='X'){const f=el('iframe');f.title='X公式埋め込み';f.loading='lazy';f.src='https://platform.twitter.com/embed/Tweet.html?id='+r.url.split('/').pop();host.append(f)}else{const f=el('iframe');f.title='pixiv公式埋め込み';f.loading='lazy';f.src='https://embed.pixiv.net/decorate.php?illust_id='+r.url.split('/').pop();host.append(f)}const a=el('a','元作品を開く');a.href=r.url;a.target='_blank';a.rel='noopener noreferrer';host.append(a)}function render(){const d=days.find(x=>x.date===$('date').value);const rows=(d?.items||[]).filter(valid);$('status').textContent=d?'X '+rows.filter(r=>r.site==='X').length+'/50件・pixiv '+rows.filter(r=>r.site==='pixiv').length+'/50件。'+(d.note||''):'調査記録なし';$('grid').replaceChildren();const q=$('q').value.toLowerCase();for(const r of rows.filter(r=>(site==='all'||r.site===site)&&((r.title||'')+' '+(r.author||'')).toLowerCase().includes(q)).sort((a,b)=>a.site.localeCompare(b.site)||(a.rank??999)-(b.rank??999))){const card=el('article');card.append(el('small',r.site+' / '+(r.rank?'順位 '+r.rank:'順位未確認')),el('h3',r.title||'作品名不明'),el('p',(r.author||'作者不明')+' / '+(r.metric||'人気指標未確認')));const p=el('div');preview(r,p);card.append(p);const b=el('button','大きく表示');b.onclick=()=>{preview(r,$('preview'));$('detail').showModal()};card.append(b);$('grid').append(card)}}document.querySelectorAll('[data-site]').forEach(b=>b.onclick=()=>{site=b.dataset.site;document.querySelectorAll('[data-site]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()});$('date').onchange=render;$('q').oninput=render;$('close').onclick=()=>$('detail').close();$('detail').onclose=()=>$('preview').replaceChildren();fetch('reference-gallery.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{days=d.days.sort((a,b)=>b.date.localeCompare(a.date));for(const x of days){const o=el('option',x.date);o.value=x.date;$('date').append(o)}render()}).catch(()=>$('status').textContent='調査記録の取得に失敗しました');</script></html>
